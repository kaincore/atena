[Service]
# módulo lab: o executor põe trabalhos na fila do Claude Code e lê os resultados (grupo atena-fila),
# grava o compose dos apps do lab e move projetos entre /srv/lab/projetos e a lixeira (grupo
# atena-lab). /srv/lab num ReadWritePaths só: mover para a lixeira é um rename, que não atravessa
# montagens.
SupplementaryGroups=atena-fila atena-lab
ReadWritePaths=-/var/lib/atena-claude/fila -/srv/lab -/opt/atena/stacks/lab
