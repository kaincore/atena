# Verificações automáticas a cada envio: scripts, composes, testes e segredos.
name: verificar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: instalador, ferramentas e scripts do servidor em bash
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 -x -s bash \
            install.sh install/*.sh tools/verificar-vazamentos.sh tools/ci-local.sh \
            $(grep -lE '^#!(/bin/bash|/usr/bin/env bash)' host/sbin/*)
      - name: scripts do servidor em sh (os de Python ficam para o job de testes)
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 -s sh \
            host/lab/atena-tela $(grep -l '^#!/bin/sh' host/sbin/* tools/hooks/* hermes/*.sh)

  python:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: erros no Python (regras no ruff.toml)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/astral-sh/ruff:0.16.10 check --no-cache \
            $(grep -l '^#!.*python' host/sbin/*) host/executor host/lab hermes/scripts tests

  composes:
    name: composes válidos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: valida cada compose com os valores de exemplo
        run: |
          set -a; . ./atena.conf.example; set +a
          for f in stacks/*/*/compose.yaml; do
            d=$(mktemp -d); cp -r "$(dirname "$f")/." "$d/"
            sed -e "s|{{ATENA_LAN_IP}}|$ATENA_LAN_IP|g" -e "s|{{ATENA_TZ}}|$ATENA_TZ|g" \
                -e "s|{{ATENA_NTFY_URL}}|$ATENA_NTFY_URL|g" "$f" > "$d/compose.yaml"
            if [ -f "$d/.env.example" ]; then cp "$d/.env.example" "$d/.env"; fi
            docker compose -f "$d/compose.yaml" config --quiet
            echo "ok $f"
          done

  testes:
    name: testes (executor, Hermes e lab)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: dependências (as mesmas do servidor)
        run: sudo apt-get install -y -qq python3-yaml && sudo mkdir -p /srv
      - name: os scripts Python compilam
        run: |
          for f in host/sbin/atena-executor host/sbin/atena-telegram host/sbin/atena-claude-runner \
                   host/sbin/atena-painel-senha host/lab/dono.py host/lab/guarda_escopo.py hermes/scripts/ronda.py \
                   host/executor/atena_executor/*.py; do
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f"
          done
      - name: testes
        run: |
          # roda todos, mesmo depois de uma falha; cada FALHA vira uma anotação do GitHub,
          # que dá para ler sem abrir o log (a API pública mostra as anotações)
          falharam=""
          for t in tests/executor/teste_*.py tests/hermes/teste_*.py tests/lab/teste_*.py; do
            echo "== $t"
            if ! (cd "$(dirname "$t")" && /usr/bin/python3 "$(basename "$t")") > saida.txt 2>&1; then
              falharam="$falharam $t"
              grep -E '^FALHA|falhas:|Error|Traceback' saida.txt | head -20 | while IFS= read -r linha; do
                echo "::error file=$t::$linha"
              done
            fi
            cat saida.txt
          done
          rm -f saida.txt
          if [ -n "$falharam" ]; then
            echo "falharam:$falharam"
            exit 1
          fi

  painel:
    name: testes do painel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: testes na mesma imagem do Node do painel
        run: |
          docker run --rm --network none -v "$PWD/stacks/core/painel/app:/app:ro" -w /app \
            node:22.23.3-alpine3.24 npm test

  segredos:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: procura segredos em todo o histórico
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 git /repo --redact -v
