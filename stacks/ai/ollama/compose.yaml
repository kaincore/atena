# Ollama: modelos locais na GTX 1060 (6 GB de VRAM)
services:
  ollama:
    image: ollama/ollama:0.40.5
    container_name: ollama
    cgroup_parent: atena-ai.slice
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    gpus: all
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_KEEP_ALIVE: 2m           # libera a VRAM depois de 2 min sem uso (divide a GPU com o Whisper e a voz)
      OLLAMA_MAX_LOADED_MODELS: "1"   # 6 GB de VRAM: um modelo por vez
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "true"         # nada de modelos na nuvem do Ollama: dados ficam aqui
    volumes:
      - /srv/ai/models/ollama:/models
      - /srv/ai/ollama:/root/.ollama
    networks: [zone]
    ports: ["127.0.0.1:11434:11434"]  # sempre com 127.0.0.1 explícito

networks:
  zone:
    name: zone-ai
    external: true
