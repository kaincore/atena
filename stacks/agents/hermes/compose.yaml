# Hermes (a Atena): assistente que conversa com você pelo Telegram e pelo painel, pensa pelo LiteLLM e só
# mexe no servidor pelo executor (lista fechada de ações). Sem Docker, sem sudo, sem rede até a sua casa.
# Configuração, segredos e memória ficam em /srv/agents/hermes (config.yaml, .env, SOUL.md, skills/).
services:
  hermes:
    image: nousresearch/hermes-agent:v0.22.2   # >= 0.22.1: correções de segurança da ponte do WhatsApp
    container_name: hermes
    command: ["gateway", "run"]           # serviço (Telegram); sem isso ele abre o chat interativo e sai
    cgroup_parent: atena-agents.slice
    restart: unless-stopped
    healthcheck:  # o gateway grava o estado de ~30 em 30 s: parado há 5 min, ou o Telegram caído, é doente
      test: ["CMD", "python3", "-c", "import json, sys, datetime as d; e = json.load(open('/opt/data/gateway_state.json')); t = e.get('platforms', {}).get('telegram', {}); idade = (d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(e['updated_at'])).total_seconds(); sys.exit(0 if e.get('gateway_state') == 'running' and t.get('state', 'connected') == 'connected' and idade < 300 else 1)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 180s
    environment:
      HERMES_UID: "${HERMES_UID}"     # usuário hermes do servidor (sem sudo, sem Docker)
      HERMES_GID: "${HERMES_GID}"     # grupo atena-acoes: dá acesso ao socket do executor
      TZ: {{ATENA_TZ}}
      # a API dela (as conversas, o chat e a agenda do painel, pelo executor) ouve só na rede svc-atena,
      # onde não há outro container; a chave é a API_SERVER_KEY do .env dela, que só o executor lê
      API_SERVER_HOST: 10.10.252.2
    volumes:
      - /srv/agents/hermes:/opt/data
      # a pasta, e não o arquivo: o socket é recriado sempre que o executor reinicia
      - /run/atena-executor:/run/atena-executor
      # A personalidade e as habilidades da Atena, só para leitura dentro do container: um texto que ela
      # leia (uma página, um e-mail) não consegue reescrever as regras dela, e o "aprendizado" do Hermes
      # também não. Quem as muda é o instalador ou o ./aplicar, no servidor. Sem o arquivo, o container não
      # sobe (create_host_path: false), em vez de o Docker criar uma pasta no lugar dele.
      - type: bind
        source: /srv/agents/hermes/SOUL.md
        target: /opt/data/SOUL.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/agents/hermes/skills/atena
        target: /opt/data/skills/atena
        read_only: true
        bind:
          create_host_path: false
    security_opt: ["no-new-privileges:true"]
    networks:
      zone: {}
      llm: {}
      ntfy: {}
      api:
        ipv4_address: 10.10.252.2

networks:
  zone:
    name: zone-agents
    external: true
  llm:
    name: svc-llm
    external: true
  ntfy:
    name: svc-ntfy        # só publica no tópico atena do ntfy
    external: true
  api:
    # só a Atena, sem saída: o executor chega pela ponte br-svc-atena, do servidor. É desta stack (o
    # compose cria), e não das zonas, porque ninguém mais entra nela
    name: svc-atena
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-svc-atena
    ipam:
      config:
        - subnet: 10.10.252.0/24
