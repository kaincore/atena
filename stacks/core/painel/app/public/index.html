<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atena</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icone-192.png">
  <link rel="preload" href="/fontes/commissioner-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/estilo.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="painel" hidden>
    <nav class="trilho" aria-label="Telas">
      <div class="trilho-marca"><span class="marca"><span aria-hidden="true">ΑΘΗΝΑ</span><span class="so-leitor">Atena</span></span><div class="zonas-pontos" aria-label="Zonas"></div></div>
      <div id="trilho-grupos"></div>
      <button type="button" class="busca" id="abrir-paleta">
        <span class="busca-rotulo">Buscar</span><kbd>Ctrl</kbd><kbd>K</kbd>
      </button>
    </nav>
    <header class="topo">
      <span class="marca"><span aria-hidden="true">ΑΘΗΝΑ</span><span class="so-leitor">Atena</span></span>
      <div class="zonas-pontos" aria-label="Zonas"></div>
    </header>
    <main id="tela"></main>
    <nav class="barra" id="barra" aria-label="Telas principais"></nav>
  </div>

  <section id="entrada" class="entrada" hidden>
    <form id="form-entrada" class="frente">
      <div class="tondo-entrada" aria-hidden="true"></div>
      <h1 class="marca"><span aria-hidden="true">ΑΘΗΝΑ</span><span class="so-leitor">Atena</span></h1>
      <label for="senha" class="rotulo">Senha do painel</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="principal">Entrar</button>
      <p id="msg-entrada" class="erro" role="alert"></p>
    </form>
  </section>

  <dialog id="janela">
    <div class="janela-topo">
      <strong id="janela-titulo"></strong>
      <button type="button" id="janela-fechar" class="discreto">Fechar</button>
    </div>
    <div id="janela-corpo"></div>
    <div id="janela-avisos" class="janela-avisos" aria-live="polite"></div>
  </dialog>

  <dialog id="mais" class="folha" aria-label="Mais telas">
    <div class="janela-topo">
      <strong>Mais</strong>
      <button type="button" id="mais-fechar" class="discreto">Fechar</button>
    </div>
    <div id="mais-teclas" class="teclado"></div>
  </dialog>

  <dialog id="paleta" class="paleta" aria-label="Buscar comandos">
    <input type="text" placeholder="Ir para uma tela ou fazer algo" autocomplete="off" spellcheck="false"
      role="combobox" aria-controls="paleta-lista" aria-expanded="true">
    <ul id="paleta-lista" role="listbox"></ul>
  </dialog>

  <div id="avisos" class="avisos" aria-live="polite"></div>
</body>
</html>
