# ntfy: avisos no celular (alertas do servidor, pedidos de aprovação, mensagens da Atena).
# Com login: ninguém lê nem publica sem usuário (auth-default-access: deny-all no server.yml).
# Os usuários de serviço são criados pelo instalador; o seu, do celular, com atena-ntfy-celular.
services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    command: ["serve"]
    user: "65534:65534"
    cgroup_parent: atena-core.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: {{ATENA_TZ}}
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - /srv/core/ntfy:/var/lib/ntfy
    networks: [zone, ntfy]
    ports:
      - "{{ATENA_LAN_IP}}:2586:2586"   # rede de casa
      - "127.0.0.1:2586:2586"      # para o tailscale serve (fora de casa) e para o executor
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:2586/v1/health -O - | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  zone:
    name: zone-core
    external: true
  ntfy:
    name: svc-ntfy        # rede interna: o Hermes publica por aqui
    external: true
