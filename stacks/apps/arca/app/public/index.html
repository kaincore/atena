<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCA - Sistema de Arquivos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>╔═══════════════════════════════════════════╗</h1>
      <h1>║            ARCA FILE SYSTEM               ║</h1>
      <h1>╚═══════════════════════════════════════════╝</h1>
    </header>

    <section class="upload-section">
      <div class="panel">
        <div class="panel-header">[ UPLOAD ]</div>
        <form id="uploadForm">
          <input type="file" id="fileInput" required>
          <button type="submit" class="btn">Enviar Arquivo</button>
        </form>
        <div id="uploadStatus" class="status"></div>
      </div>
    </section>

    <section class="files-section">
      <div class="panel">
        <div class="panel-header">[ ARQUIVOS ]</div>
        <div id="filesInfo" class="info-bar"></div>
        <div id="filesList" class="files-list"></div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
