# Arca: envio e download de arquivos pelo navegador (acesso só pelo Tailscale)
services:
  arca:
    build: ./app
    image: atena/arca:1.1.1
    container_name: arca
    cgroup_parent: atena-apps.slice
    restart: unless-stopped
    read_only: true                 # o container só escreve nos volumes abaixo
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PORT: "3002"
    volumes:
      - /srv/apps/arca/uploads:/app/uploads
      - /srv/apps/arca/data:/app/data
    networks: [zone]
    ports:
      - "127.0.0.1:3002:3002"
      - "{{ATENA_LAN_IP}}:3002:3002"    # rede de casa; liberado no atena-docker-firewall

networks:
  zone:
    name: zone-apps
    external: true
